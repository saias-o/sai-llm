<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>SAIAS Chat</title>
<link rel="icon" href="saias.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand"><img class="logo" src="saias.ico" alt=""><span>SAIAS</span></div>
      <button class="icon-button" id="collapse" type="button" title="Hide the sidebar" aria-label="Hide the sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button class="new-chat" id="new-chat" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="Search chats" autocomplete="off">
    </div>
    <nav class="history" id="history" aria-label="Conversations"></nav>
    <div class="sidebar-foot">
      <button class="foot-button" id="open-settings" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-button" id="expand" type="button" title="Show the sidebar" aria-label="Show the sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="picker" id="model-picker">
        <button class="picker-button" id="model-button" type="button" aria-haspopup="listbox">
          <span id="model-name">saias-flash</span>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="model-menu" role="listbox" hidden></div>
      </div>
      <div class="picker" id="tools-picker">
        <button class="chip-button" id="tools-button" type="button" title="Tools">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span id="tools-name">Tools</span>
        </button>
        <div class="menu tools-menu" id="tools-menu" hidden></div>
      </div>
      <div class="spacer"></div>
      <div class="gauge" id="gauge" tabindex="0">
        <svg viewBox="0 0 36 36" class="ring"><circle class="ring-track" cx="18" cy="18" r="15"/><circle class="ring-fill" id="ring-fill" cx="18" cy="18" r="15"/></svg>
        <div class="gauge-text"><span id="gauge-used">0</span><span class="gauge-total" id="gauge-total"></span></div>
        <div class="gauge-tip" id="gauge-tip" role="tooltip"></div>
      </div>
    </header>

    <section class="thread" id="thread" aria-live="polite">
      <div class="thread-inner" id="messages"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer" id="composer">
        <div class="attachments" id="attachments" hidden></div>
        <textarea id="input" rows="1" placeholder="Message SAIAS" autocomplete="off"></textarea>
        <div class="composer-row">
          <button class="icon-button" id="attach" type="button" title="Attach images, PDFs or text files" aria-label="Attach files">
            <svg viewBox="0 0 24 24"><path d="m21 11.5-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
          </button>
          <div class="picker up" id="reasoning-picker">
            <button class="chip-button" id="reasoning-button" type="button" title="Reasoning effort">
              <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
              <span id="reasoning-name">Default</span>
            </button>
            <div class="menu" id="reasoning-menu" role="listbox" hidden></div>
          </div>
          <button class="chip-button" id="image-button" type="button" title="Generate with saias-image" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m3 17 5-4 4 3 4-6 5 7"/></svg>
            <span>Create image</span>
          </button>
          <input id="file" type="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md,.csv,.json,.js,.ts,.py,.c,.cpp,.h,.hpp,.cs,.java,.go,.rs,.html,.css,.xml,.yaml,.yml,.ini,.log,.sql,.sh,.ps1">
          <span class="composer-status" id="status"></span>
          <button class="send" id="send" type="button" title="Send (Enter)" aria-label="Send">
            <svg class="send-icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">SAIAS models can make mistakes. Check important information.</div>
    </footer>
  </main>
</div>

<div class="dialog-backdrop" id="settings" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <label for="memory">Memory</label>
    <p class="hint">Facts and preferences included in every chat, for example your name or the language you prefer.</p>
    <textarea id="memory" rows="5"></textarea>
    <label for="system-prompt">Instructions</label>
    <p class="hint">How the model should answer. Leave empty for the model's default.</p>
    <textarea id="system-prompt" rows="5"></textarea>
    <div class="dialog-actions">
      <button class="secondary" id="settings-cancel" type="button">Cancel</button>
      <button class="primary" id="settings-save" type="button">Save</button>
    </div>
  </div>
</div>

<div class="drop" id="drop" hidden><div>Drop files to attach them</div></div>

<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
