<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAI-LLM — Chat</title>
  <link rel="stylesheet" href="app.css">
  <!-- pdf.js: text-layer extraction for PDF attachments (browser-side, mirrors native PDFium) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" async></script>
</head>
<body>
  <!-- ================= HEADER ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">SAI‑LLM</span>
      <span class="badge web">web</span>
      <span class="status" id="status-dot" title="Backend health"></span>
      <span class="status-label" id="status-text"></span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="theme-btn" title="Toggle light/dark theme">◑</button>
      <button class="icon-btn" id="templates-btn" title="Chat templates">📄</button>
      <button class="icon-btn" id="settings-btn" title="Settings (memory &amp; system prompt)">⚙</button>
    </div>
  </header>

  <!-- ================= BODY GRID ================= -->
  <main class="app">
    <!-- SIDEBAR: conversations -->
    <aside class="sidebar">
      <button class="btn btn-new" id="new-chat">＋ New chat</button>
      <ul class="conv-list" id="conv-list"></ul>
      <div class="sidebar-tools">
        <div class="tool-row">
          <label class="tool-label">Model</label>
          <select id="model-select" class="tool-select"></select>
        </div>
        <div class="tool-row">
          <label class="tool-label">Reasoning</label>
          <select id="reasoning-select" class="tool-select"></select>
        </div>
        <div class="card" id="advisor-box">
          <div class="card-head" style="display:none"><span>Advisor</span></div>
          <div class="card-body" id="advisor-body">Loading…</div>
        </div>
        <div class="card" id="hardware-box">
          <div class="card-head"><span>Hardware</span></div>
          <div class="card-body" id="hardware-body">Loading…</div>
        </div>
      </div>
    </aside>

    <!-- MAIN: chat -->
    <section class="chat-area">
      <div class="chat" id="chat">
        <div class="empty" id="empty">
          <div class="empty-icon">✦</div>
          <p>Pick a model and a reasoning setting, then type below.</p>
          <p class="muted">PDFs work on every model. Images work with <code>sai-smart</code> and <code>sai-max</code>.</p>
        </div>
      </div>

      <!-- COMPOSER -->
      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-attach">
          <button type="button" class="chip-btn" id="pdf-btn" title="Attach PDF (≤32 MB, text extracted in browser)">📄 PDF</button>
          <button type="button" class="chip-btn" id="image-btn" title="Attach image (≤5 MB, sai-smart or sai-max, PNG/JPEG)">🖼 Image</button>
          <span class="chips" id="attachments"></span>
        </div>
        <input type="file" id="pdf-input" accept="application/pdf" hidden>
        <input type="file" id="image-input" accept="image/png,image/jpeg" hidden>
        <div class="composer-row">
          <textarea id="prompt" rows="1" placeholder="Message the model… (Enter to send, Shift+Enter for new line)"></textarea>
          <button type="button" class="send-btn" id="send" title="Send">
            <span class="send-glyph">➤</span>
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- ================= TOAST ================= -->
  <div class="toast" id="toast"></div>

  <!-- ================= SETTINGS MODAL ================= -->
  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Settings</h2>
        <button class="modal-x" id="close-settings" title="Close">×</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Memory <span class="hint">(prepended to every conversation)</span></label>
        <textarea id="memory-input" rows="6" placeholder="e.g. I work on R1World. Keep answers concise." aria-label="Memory"></textarea>
        <label class="field-label">System prompt</label>
        <textarea id="system-input" rows="8" placeholder="Instructions to give the model at the start of a conversation." aria-label="System prompt"></textarea>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" id="cancel-settings">Cancel</button>
        <button class="btn" id="save-settings">Save</button>
      </div>
    </div>
  </div>

  <!-- ================= TEMPLATES MODAL ================= -->
  <div class="modal-backdrop" id="templates-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Chat templates</h2>
        <button class="modal-x" id="close-templates" title="Close">×</button>
      </div>
      <div class="modal-body">
        <ul class="template-list" id="templates-list"></ul>
        <div class="modal-body" id="template-view" hidden>
          <div class="template-head">
            <span class="template-name" id="template-name"></span>
            <button class="btn btn-small" id="copy-template">Copy</button>
          </div>
          <pre class="template-text" id="template-text"></pre>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" id="cancel-templates">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
