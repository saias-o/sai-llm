services:
  saias-pro:
    image: vllm/vllm-openai:inkling-2-mini
    gpus: all
    ipc: host
    ports:
      - "127.0.0.1:8081:8000"
    volumes:
      - inkling-cache:/root/.cache/huggingface
    command:
      - thinkingmachines/Inkling-2-Mini
      - --revision
      - b85c3cfa615fc413cc9af3379f491b963f3b586a
      - --served-model-name
      - saias-pro
      - --max-model-len
      - "1048576"
      - --max-num-seqs
      - "1"
      - --tensor-parallel-size
      - "${SAIAS_PRO_TENSOR_PARALLEL_SIZE:-${SAIAS_MAX_TENSOR_PARALLEL_SIZE:-1}}"
      - --default-chat-template-kwargs
      - '{"reasoning_effort":0.99}'
      - --reasoning-parser
      - inkling
      - --enable-auto-tool-choice
      - --tool-call-parser
      - inkling

volumes:
  inkling-cache:
